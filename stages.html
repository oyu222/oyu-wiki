<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>お湯レジェンド - お湯Wiki</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head>

<body class="stage-info-page">

<header>
    <h1>
    <img
        src="images/Sakura_medal.png"
        class="site-logo"
        alt=""
    >
    お湯Wiki
</h1>

    <a href="index.html" class="back-button">
        ← トップへ戻る
    </a>
</header>

<main class="stage-info-list">

    <div class="stage-info-title">
        ステージ
    </div>

    <div class="stage-info-divider"></div>

    <div id="chapterList"></div>

</main>

<script>

const mapType = new URLSearchParams(
    window.location.search
).get("mapType");


const chapterList =
    document.getElementById("chapterList");


function esc(value) {

    return String(value).replace(
        /[&<>'"]/g,
        c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "'": "&#39;",
            '"': "&quot;"
        }[c])
    );

}


async function loadData() {

    const { data, error } =
        await supabaseClient
            .from("stage_data")
            .select("chapters, map_types")
            .eq("id", "main")
            .maybeSingle();


    if (error) {

        console.error(
            "Supabase読み込みエラー:",
            error
        );

        return {
            chapters: [],
            mapTypes: []
        };

    }


    return {

        chapters:
            Array.isArray(data?.chapters)
                ? data.chapters
                : [],

        mapTypes:
            Array.isArray(data?.map_types)
                ? data.map_types
                : []

    };

}


// =========================
// マップ種類一覧
// =========================

async function renderMapTypes() {

    const data =
        await loadData();


    let mapTypes =
        data.mapTypes;


    // 新データがまだない場合は
    // 旧データをお湯レジェンドとして扱う
    if (!mapTypes.length) {

        mapTypes = [

            {
                id: "map_legacy",
                name: "お湯レジェンド",
                chapters: data.chapters
            }

        ];

    }


    document
        .querySelector(".stage-info-title")
        .textContent =
            "ステージ図鑑";


    if (!mapTypes.length) {

        chapterList.innerHTML = `
            <div class="stage-info-empty">
                まだマップがありません。
            </div>
        `;

        return;

    }


    chapterList.innerHTML =
        mapTypes
            .map(
                map => `

                    <a
                        class="stage-info-chapter"
                        href="stages.html?mapType=${encodeURIComponent(map.id)}"
                    >

                        <span class="stage-info-chapter-number">
                            -
                        </span>

                        <span class="stage-info-chapter-name">
                            ${esc(map.name)}
                        </span>

                    </a>

                `
            )
            .join("");

}


// =========================
// 章一覧
// =========================

async function renderChapters() {

    const data =
        await loadData();


    let mapTypes =
        data.mapTypes;


    // 旧データとの互換
    if (!mapTypes.length) {

        mapTypes = [

            {
                id: "map_legacy",
                name: "お湯レジェンド",
                chapters: data.chapters
            }

        ];

    }


    const selectedMap =
        mapTypes.find(
            map =>
                String(map.id) ===
                String(mapType)
        );


    if (!selectedMap) {

        await renderMapTypes();
        return;

    }


    document
        .querySelector(".stage-info-title")
        .textContent =
            selectedMap.name;


    if (
        !Array.isArray(selectedMap.chapters) ||
        !selectedMap.chapters.length
    ) {

        chapterList.innerHTML = `
            <div class="stage-info-empty">
                まだ章がありません。
            </div>
        `;

        return;

    }


    chapterList.innerHTML =
        selectedMap.chapters
            .map(
                (chapter, index) => `

                    <a
                        class="stage-info-chapter"
                        href="
                            stage.html?mapType=${encodeURIComponent(selectedMap.id)}
                            &chapter=${encodeURIComponent(chapter.id)}
                        "
                    >

                        <span class="stage-info-chapter-number">
                            ${index + 1}
                        </span>

                        <span class="stage-info-chapter-name">
                            ${esc(chapter.name)}
                        </span>

                    </a>

                `
            )
            .join("");

}


renderChapters();

</script>

</body>
</html>
