<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>お湯レジェンド - お湯Wiki</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head>

<body class="stage-info-page">

<header>
    <h1>♨️ お湯Wiki</h1>

    <a href="index.html" class="back-button">
        ← トップへ戻る
    </a>
</header>

<main class="stage-info-list">

    <div class="stage-info-title">
        お湯レジェンド
    </div>

    <div class="stage-info-divider"></div>

    <div id="chapterList"></div>

</main>

<script>

const KEY = "oyuWikiStages";

const chapterList =
    document.getElementById("chapterList");

function esc(value) {

    return String(value).replace(
        /[&<>'"]/g,
        c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "'": "&#39;",
            '"': "&quot;"
        }[c])
    );

}

async function loadChapters() {

    const { data, error } =
        await supabaseClient
            .from("stage_data")
            .select("chapters")
            .eq("id", "main")
            .maybeSingle();

    if (error) {
        console.error(
            "Supabase読み込みエラー:",
            error
        );
        return [];
    }

    return Array.isArray(data?.chapters)
        ? data.chapters
        : [];
}

async function renderChapters() {

    const chapters = await loadChapters();

    if (!chapters.length) {

        chapterList.innerHTML = `
            <div class="stage-info-empty">
                まだステージがありません。
            </div>
        `;

        return;
    }

    chapterList.innerHTML =
        chapters.map((chapter, index) => `

            <a
                class="stage-info-chapter"
                href="stage.html?chapter=${encodeURIComponent(chapter.id)}"
            >

                <span class="stage-info-chapter-number">
                    ${index + 1}
                </span>

                <span class="stage-info-chapter-name">
                    ${esc(chapter.name)}
                </span>

            </a>

        `).join("");

}

renderChapters();

</script>

</body>
</html>
