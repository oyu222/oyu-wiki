<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>ステージ制作 - お湯Wiki</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head>

<body>

<header>
    <h1>
    <img
        src="images/Sakura_medal.png"
        class="site-logo"
        alt=""
    >
    お湯Wiki
</h1>
</header>

<main class="stage-editor">

    <div class="stage-editor-toolbar">

        <button type="button">
            ← 戻る
        </button>

        <h2>ステージ制作</h2>

        <button
            id="save"
            type="button"
            class="stage-save-button"
        >
            保存
        </button>

    </div>

    <div class="stage-editor-window">



       <!-- =================================
     ① マップ種類
================================== -->

<section class="stage-column map-type-column">

    <div class="stage-column-title">
        ①
    </div>

    <div class="stage-column-buttons">

        <button id="addMapType">
            追加
        </button>

        <button id="deleteMapType">
            削除
        </button>

    </div>

    <div
        id="mapTypeList"
        class="stage-list"
    ></div>

    <div class="stage-bottom-buttons">

        <button>
            マップをコピー
        </button>

        <button>
            マップ貼り付け
        </button>

        <button>
            マップを削除
        </button>

    </div>

</section>


<!-- =================================
     ② 章
================================== -->

<section class="stage-column chapter-column">

    <div class="stage-column-title">
        ②
    </div>

    <div class="stage-column-buttons">

        <button id="addChapter">
            追加
        </button>

        <button id="deleteChapter">
            削除
        </button>

    </div>

    <div
        id="chapterList"
        class="stage-list"
    ></div>

</section>


        <!-- =================================
             ③ ステージ
        ================================== -->

        <section class="stage-column stage-list-column">

            <div class="stage-column-title">
                ③
            </div>

            <div class="stage-column-buttons">

                <button id="addStage">
                    追加
                </button>

                <button id="deleteStage">
                    削除
                </button>

            </div>

            <div
                id="stageList"
                class="stage-list"
            ></div>

            <div class="stage-bottom-buttons">

                <button>
                    ステージをコピー
                </button>

                <button>
                    ステージ貼り付け
                </button>

                <button>
                    ステージを削除
                </button>

            </div>

        </section>


        <!-- =================================
             ④ キャラクター
        ================================== -->

        <section class="stage-column character-column">

            <div class="stage-column-title">
                ④
            </div>

            <input
                id="characterSearch"
                class="stage-character-search"
                type="text"
                placeholder="Search enemy..."
            >

            <details class="stage-attribute-filter">

    <summary>
        属性で絞り込み
    </summary>

    <div id="attributeFilterList"></div>

</details>

            <div
                id="characterList"
                class="stage-character-list"
            ></div>

        </section>


        <!-- =================================
             ⑤ メイン
        ================================== -->

        <section class="stage-main">

            <!-- =================================
                 ステージ情報
            ================================== -->

            <div class="stage-data-area">

                <div class="stage-data-row">

                    <div class="stage-cell stage-name-cell">

                        <label>
                            ステージ
                        </label>

                        <input
                            id="stageName"
                            type="text"
                        >

                    </div>

                    <div class="stage-cell">

                        <label>
                            星1
                        </label>

                        <input
                            type="text"
                            value="100%"
                        >

                    </div>

                    <div class="stage-cell">

                        <label>
                            星2
                        </label>

                        <input
                            type="text"
                            value="/"
                        >

                    </div>

                    <div class="stage-cell">

                        <label>
                            星3
                        </label>

                        <input
                            type="text"
                            value="/"
                        >

                    </div>

                    <div class="stage-cell">

                        <label>
                            星4
                        </label>

                        <input
                            type="text"
                            value="/"
                        >

                    </div>

                </div>


               <div class="stage-data-grid">

    <div class="data-label">
        城体力
    </div>

    <input
        id="castleHealth"
        type="number"
        value="10000"
        min="1"
    >

    <div class="data-label">
        出撃最大数
    </div>

    <input
        id="maxEnemies"
        type="number"
        value="8"
    >





    <div class="data-label">
        ステージ幅
    </div>

    <input
        id="stageWidth"
        type="number"
        value="3000"
    >

    <div class="data-label">
        制限
    </div>

    <input
        id="spawnRestriction"
        type="text"
        value=""
    >



    
    <div class="data-label">統率力</div>
<input id="leadership" type="number" value="0">

    <input
        type="text"
    >



</div>

            <!-- =================================
                 新ライン
            ================================== -->

            <div class="stage-line-toolbar">
                <button id="addLine" disabled>
    新ライン
</button>

<button id="copyLine" type="button">
    ラインをコピー
</button>

<button id="moveLineUp" type="button">
    ↑
</button>

<button id="moveLineDown" type="button">
    ↓
</button>

<button id="deleteLine" type="button">
    パートの削除
</button>
            </div>


            <!-- =================================
                 ⑤ 出現ライン表
            ================================== -->

            <div class="stage-spawn-table-wrapper">

                <table class="stage-spawn-table">

                    <thead>

                        <tr>

                            <th>ボス</th>

                            <th>敵キャラ</th>

                            <th>強化倍率</th>

                            <th>出現数</th>

                            <th>城連動</th>

                            <th>初登場</th>

                            <th>再登場</th>


                        </tr>

                    </thead>

                    <tbody id="spawnList"></tbody>

                </table>

            </div>

            <div
                id="selectedCharacter"
                class="stage-selected-character"
            >
                キャラクターを選択してください
            </div>

        </section>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script src="stage_editor.js"></script>

</body>
</html>
